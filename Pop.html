<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login MiraiApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #B197FC;
            --dark-text: #2D2D2D;
            --bg-light: #F8F9FA;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-purple);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone-container {
            background-color: var(--primary-purple);
            width: 375px;
            height: 700px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        /* Elemen Kucing/Logo */
        .logo-section {
            margin-top: 80px;
            text-align: center;
        }

        .logo-placeholder {
            width: 120px;
            height: 120px;
            background: white;
            mask: url('https://raw.githubusercontent.com/google/material-design-icons/master/src/social/person/materialicons/24px.svg') no-repeat center; /* Ganti dengan SVG kucing jika ada */
            -webkit-mask: url('https://raw.githubusercontent.com/google/material-design-icons/master/src/social/person/materialicons/24px.svg') no-repeat center;
            background-color: white;
            border-radius: 50%; /* Hanya contoh, aslinya bentuk kucing */
            margin-bottom: 20px;
        }

        /* Area Putih di Bawah */
        .bottom-card {
            background-color: white;
            width: 100%;
            flex-grow: 1;
            margin-top: 50px;
            border-radius: 50% 50% 0 0 / 15% 15% 0 0;
            padding: 40px 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Gaya Tombol */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s;
            border: 2px solid #000;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-apple { background: white; color: black; }
        .btn-google { background: white; color: black; }
        .btn-email { background: white; color: black; }

        .btn img {
            width: 20px;
            margin-right: 10px;
        }

        .footer-text {
            color: #888;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
        }

        .footer-text a {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="logo-section">
        <svg width="100" height="100" viewBox="0 0 100 100" fill="white">
            <path d="M20 40C20 20 40 10 50 10C60 10 80 20 80 40V70C80 85 65 90 50 90C35 90 20 85 20 70V40Z"/>
            <circle cx="35" cy="45" r="5" fill="#B197FC"/>
            <circle cx="65" cy="45" r="5" fill="#B197FC"/>
            <path d="M45 55Q50 60 55 55" stroke="#B197FC" stroke-width="3" fill="none"/>
        </svg>
    </div>

    <div class="bottom-card">
        <a href="#" class="btn btn-apple">
            Sign in with Apple
        </a>
        <a href="#" class="btn btn-google">
            Sign in with Google
        </a>
        <a href="#" class="btn btn-email">
            Continue with email
        </a>

        <div class="footer-text">
            Don't have an account yet?<br>
            <a href="#">Register one here</a>
        </div>
    </div>
</div>

</body>
</html>
